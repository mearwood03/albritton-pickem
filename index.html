<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002244">
<title>Albritton's Pick Em's</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <img class="logo" src="logo.png" alt="Albritton's Pick Em's logo">
      <div>
        <h1>Albritton's Pick Em's</h1>
        <div class="sub">Pick every winner &middot; MNF total points breaks ties</div>
      </div>
    </div>
    <div class="who" id="who"></div>
  </div>
  <div class="venmo-bar">
    <a class="venmo" id="venmoLink" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 3c.7 1.1 1 2.3 1 3.8 0 4.7-4 10.8-7.3 15.2H5.8L2.8 4.4l6.6-.6 1.6 12.8c1.5-2.4 3.3-6.2 3.3-8.8 0-1.4-.2-2.4-.6-3.2z"/></svg>
      <span>Pay on Venmo <b id="venmoTag"></b></span>
    </a>
    <span class="fee" id="fee"></span>
    <div class="pot" id="pot" hidden>
      <svg class="potsvg" viewBox="0 0 120 100" aria-hidden="true">
        <defs>
          <radialGradient id="potBody" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#5a5a5a"/><stop offset=".45" stop-color="#1e1e1e"/><stop offset="1" stop-color="#050505"/></radialGradient>
          <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a6"/><stop offset=".5" stop-color="#f2c230"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
        </defs>
        <path d="M24 38 C24 6 96 6 96 38" fill="none" stroke="#555" stroke-width="3.5"/>
        <ellipse cx="60" cy="38" rx="38" ry="9" fill="#b8860b"/>
        <g fill="url(#coin)" stroke="#a57400" stroke-width=".8">
          <ellipse cx="44" cy="34" rx="9" ry="4"/><ellipse cx="60" cy="31" rx="9" ry="4"/><ellipse cx="76" cy="34" rx="9" ry="4"/>
          <ellipse cx="52" cy="27" rx="9" ry="4"/><ellipse cx="68" cy="26" rx="9" ry="4"/><ellipse cx="60" cy="21" rx="9" ry="4"/>
          <ellipse cx="36" cy="38" rx="7" ry="3"/><ellipse cx="84" cy="38" rx="7" ry="3"/>
        </g>
        <ellipse cx="60" cy="41" rx="42" ry="7" fill="#111"/>
        <path d="M20 42 C14 70 30 94 60 94 C90 94 106 70 100 42 Z" fill="url(#potBody)"/>
        <ellipse cx="14" cy="60" rx="5" ry="8" fill="none" stroke="#111" stroke-width="4"/>
        <ellipse cx="106" cy="60" rx="5" ry="8" fill="none" stroke="#111" stroke-width="4"/>
        <ellipse cx="44" cy="58" rx="9" ry="14" fill="#fff" opacity=".08"/>
      </svg>
      <div class="pottext"><b id="potAmt">$0</b><span id="potSub">this week’s pot</span></div>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button data-tab="picks" role="tab">My Picks</button>
    <button data-tab="board" role="tab">Leaderboard</button>
  </nav>
</header>

<main class="wrap">
  <div class="weekbar">
    <button class="nav" id="prevWk" aria-label="Previous week">&#8249;</button>
    <div class="wk"><div class="wk-n" id="wkLabel">Week</div><div class="wk-s" id="wkSub"></div></div>
    <button class="nav" id="nextWk" aria-label="Next week">&#8250;</button>
  </div>
  <div class="notice" id="notice" hidden></div>

  <section id="tab-picks" hidden></section>
  <section id="tab-board" hidden></section>

  <p class="foot">Scores from ESPN, updated automatically <span id="updated"></span><br><button class="linkbtn" data-act="admin" id="adminLink">Commissioner</button></p>
</main>

<div class="modal" id="adminModal" hidden>
  <form class="modal-card" id="adminForm">
    <h2>Commissioner</h2>
    <p>Blake's login for marking who paid and removing people.</p>
    <input id="adminEmail" type="email" autocomplete="username" placeholder="Email" required>
    <input id="adminPass" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" minlength="6" required>
    <div class="row">
      <button type="button" class="btn ghost" id="adminCancel">Cancel</button>
      <button class="btn">Sign in</button>
    </div>
    <p class="links"><button type="button" class="linkbtn" id="adminCreate">First time? Create the account</button> · <button type="button" class="linkbtn" id="adminReset">Forgot password</button></p>
    <p class="muted msg" id="adminMsg"></p>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="history.js"></script>
<script src="app.js"></script>
</body>
</html>
